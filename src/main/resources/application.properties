# Application Configuration
spring.application.name=teamflow-api
app.version=1.0.0
app.description=Team Collaboration and Project Management API

# server
server.port=8080
server.servlet.context-path=/api
server.servlet.session.timeout=30m

# database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# connection pool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# jpa/hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# jwt
jwt.secret=${TEAMFLOW_JWT_SECRET}
jwt.expiration=900000
jwt.refresh.expiration=604800000
jwt.refresh-cookie.secure=false

# cors
app.cors.allowed-origin=http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# logging
logging.level.root=INFO
logging.level.com.teamflow.teamflow_api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/teamflow.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.level.com.zaxxer.hikari=DEBUG